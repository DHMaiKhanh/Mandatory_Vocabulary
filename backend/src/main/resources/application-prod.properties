# =====================================================================
# Cấu hình khi DEPLOY (profile "prod"). Chỉ dùng trên host (Render...).
# Local dev vẫn dùng application.properties (H2) như bình thường.
# Kích hoạt bằng biến môi trường: SPRING_PROFILES_ACTIVE=prod
# =====================================================================

# Cổng do host cấp qua biến PORT (Render tự set). Local fallback 8090.
server.port=${PORT:8090}

# --- PostgreSQL (các biến DB_* được render.yaml tự nối từ database) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# Tắt H2 console trên bản chạy thật cho an toàn.
spring.h2.console.enabled=false

# JSON: don't fail on empty beans
spring.jackson.serialization.fail-on-empty-beans=false
