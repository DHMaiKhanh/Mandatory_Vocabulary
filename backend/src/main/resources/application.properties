# Server
server.port=8090

# H2 file-based database (data persists in ./data/vocabdb.mv.db)
spring.datasource.url=jdbc:h2:file:./data/vocabdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Keep the persistence session open while Jackson serializes the lazy
# WordSet -> words collection (avoids LazyInitializationException).
spring.jpa.open-in-view=true

# H2 web console at http://localhost:8090/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON: don't fail on empty beans
spring.jackson.serialization.fail-on-empty-beans=false
